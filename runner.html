<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheer Crew · Runner</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16263F">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#EEF1F4;--panel:#FFFFFF;--fg:#16202E;--muted:#5A6778;--line:#D5DBE3;--accent:#1C7FD0;--accent-ink:#FFFFFF;--ok:#1F8A4C;--ok-bg:#E2F3E8;--warn:#A86A00;--warn-bg:#FBF0D9;--bad:#C0322B;--bad-bg:#FBE3E1;--chip:#EEF1F4;--hero:#16263F;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F151E;--panel:#161E2A;--fg:#E6ECF3;--muted:#9AA7B8;--line:#2A3544;--accent:#4BA3EA;--accent-ink:#08121E;--ok:#5CC98A;--ok-bg:#15301F;--warn:#E3AE4A;--warn-bg:#33280F;--bad:#FF7A70;--bad-bg:#3A1A18;--chip:#1F2937;--hero:#0B1320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F151E;--panel:#161E2A;--fg:#E6ECF3;--muted:#9AA7B8;--line:#2A3544;--accent:#4BA3EA;--accent-ink:#08121E;--ok:#5CC98A;--ok-bg:#15301F;--warn:#E3AE4A;--warn-bg:#33280F;--bad:#FF7A70;--bad-bg:#3A1A18;--chip:#1F2937;--hero:#0B1320;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
.hero{background:var(--hero);color:#fff;padding:22px 16px 26px;position:relative}
.hero .race{padding-right:56px}
.hero .race{font:600 13px var(--f-body);opacity:.75;letter-spacing:.02em}
.hero h1{font:700 34px/1.05 var(--f-display);margin:6px 0 8px;letter-spacing:.01em}
.hero p{margin:0;opacity:.88;max-width:34em}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.card h2{font:700 21px/1.15 var(--f-display);margin:0;display:flex;gap:10px;align-items:center}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px var(--f-display)}
.card p,.card ul{margin:0}
.card ul{padding-left:20px;display:grid;gap:4px}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:10px;padding:12px 16px;font:600 15px var(--f-body);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-size:17px}
.status{border-radius:10px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center}
.status.wait{background:var(--warn-bg);color:var(--warn)}.status.ok{background:var(--ok-bg);color:var(--ok)}.status.bad{background:var(--bad-bg);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.status.ok .dot{animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status.ok .dot{animation:none}}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
code,.mono{font:13px var(--f-mono);word-break:break-all}
.copy{display:flex;gap:6px;align-items:center;background:var(--chip);border-radius:8px;padding:8px 10px;margin-top:6px}
.copy code{flex:1}
.copy button{border:0;background:none;color:var(--accent);font:600 13px var(--f-body);cursor:pointer}
.err{max-width:560px;margin:24px auto;padding:16px}
.lang{position:absolute;top:14px;right:16px;background:none;border:1px solid rgb(255 255 255 / .4);color:#fff;border-radius:8px;padding:4px 10px;font:600 13px var(--f-body);cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
const ES = {
  race: "Maratón de Chicago · 11 oct 2026",
  title: n => `${n ? n + ", tu" : "Tu"} porra te va a seguir en vivo`,
  intro: "Con esto tu porra ve dónde vas de verdad durante el maratón y sabe exactamente cuándo llegar a cada punto para verte. Solo necesitas tu celular. Toma 2 minutos.",
  s1: "Instala OwnTracks", s1p: "Es gratis, sin anuncios y sin cuenta. Solo manda tu ubicación a tu porra. Si ya la tenías, actualízala.",
  sx: "Deja que el link la configure", sxp: "OwnTracks bloquea los links de configuración hasta que lo permites (es una medida de seguridad). Ábrela una vez y:",
  sxios: "<b>iPhone:</b> toca <b>ⓘ</b> (arriba a la izquierda del mapa) → <b>Settings</b> → <b>Remote Control</b> → activa <b>Allow external configuration</b> → confirma.",
  sxand: "<b>Android:</b> menú <b>☰</b> → <b>Preferences</b> → <b>Remote Control</b> → activa <b>Allow external configuration</b> → <b>Enable</b>. (En algunas versiones está en <b>Advanced</b>.)",
  s2: "Conéctala con tu porra", s2b: "Conectar OwnTracks", s2p: "Regresa a esta página y toca el botón. Se abre OwnTracks con los cambios: toca <b>Importar / Guardar</b>. Si no pasa nada o dice <i>not allowed</i>, revisa el paso anterior o usa la configuración a mano.",
  s3: "Permite la ubicación siempre",
  s3ios: "<b>iPhone:</b> Ajustes → OwnTracks → Ubicación → <b>Siempre</b>, y activa <b>Ubicación exacta</b>.",
  s3and: "<b>Android:</b> permiso de ubicación → <b>Permitir todo el tiempo</b>. Ajustes → Apps → OwnTracks → Batería → <b>Sin restricciones</b>.",
  s4: "Prueba que llega", s4p: "En OwnTracks toca el botón de enviar (flecha ↑) para mandar tu ubicación ahora.",
  wait: "Esperando tu ubicación…", ok: a => `¡Te vemos! Último dato ${a}`, noStore: "El servidor aún no está listo. Avísale a quien te mandó el link.", net: "Sin conexión. Reintentando…",
  s5: "El día de la carrera",
  s5l: ["Carga tu celular al 100% (OwnTracks en modo Move gasta batería; lleva batería externa si tu celular es viejo).", "Antes de ir al corral, en OwnTracks cambia el modo a <b>Move</b>: en iPhone toca <b>Move</b> en la barra de modos arriba del mapa (Quiet · Manual · Significant · Move); en Android, el ícono de modo en la barra superior. Si conectaste con el botón, ya queda en Move.", "No cierres OwnTracks deslizándola. Puede quedarse en segundo plano con la pantalla bloqueada.", "Después de la carrera cambia a <b>Significant</b> o <b>Quiet</b>, o desinstálala."],
  manual: "¿El botón Conectar no funcionó? Configúralo a mano",
  m1: "En OwnTracks: Settings / Preferences → Connection → Mode: <b>HTTP</b>.", m2: "URL o Host (cópiala completa):", m3: id => `Tracker ID: <b>${id}</b>. Authentication / usuario y contraseña: apagados o vacíos.`, m4: "Guarda y cambia el modo de monitoreo a <b>Move</b> (paso 6).",
  copy: "Copiar", copied: "Copiado",
  privacy: "Tu ubicación solo la ve tu porra (quien tenga su plan) y se borra sola a los 14 días.",
  bad: "Este link no está completo. Pídele a tu porra que te lo mande otra vez.",
  ago: s => s < 60 ? `hace ${s} s` : s < 5400 ? `hace ${Math.round(s / 60)} min` : "hace más de 1 h"
};
const EN = {
  race: "Chicago Marathon · Oct 11, 2026",
  title: n => `${n ? n + ", your" : "Your"} cheer crew will follow you live`,
  intro: "This lets your cheer crew see where you really are during the marathon and know exactly when to be at each spot to see you. All you need is your phone. Takes 2 minutes.",
  s1: "Install OwnTracks", s1p: "Free, no ads, no account. It only sends your location to your crew. If you already had it, update it.",
  sx: "Let the link set it up", sxp: "OwnTracks blocks configuration links until you allow them (a security setting). Open it once and:",
  sxios: "<b>iPhone:</b> tap <b>ⓘ</b> (top left of the map) → <b>Settings</b> → <b>Remote Control</b> → turn on <b>Allow external configuration</b> → confirm.",
  sxand: "<b>Android:</b> <b>☰</b> menu → <b>Preferences</b> → <b>Remote Control</b> → turn on <b>Allow external configuration</b> → <b>Enable</b>. (Some versions have it under <b>Advanced</b>.)",
  s2: "Connect it to your crew", s2b: "Connect OwnTracks", s2p: "Come back to this page and tap the button. OwnTracks opens with the changes: tap <b>Import / Save</b>. If nothing happens or it says <i>not allowed</i>, check the previous step or set it up by hand.",
  s3: "Allow location always",
  s3ios: "<b>iPhone:</b> Settings → OwnTracks → Location → <b>Always</b>, and turn on <b>Precise Location</b>.",
  s3and: "<b>Android:</b> location permission → <b>Allow all the time</b>. Settings → Apps → OwnTracks → Battery → <b>Unrestricted</b>.",
  s4: "Check that it arrives", s4p: "In OwnTracks tap the send button (↑ arrow) to send your location now.",
  wait: "Waiting for your location…", ok: a => `We can see you! Last update ${a}`, noStore: "The server isn't ready yet. Tell whoever sent you the link.", net: "No connection. Retrying…",
  s5: "On race day",
  s5l: ["Charge your phone to 100% (Move mode uses battery; bring a power bank if your phone is old).", "Before heading to your corral, switch OwnTracks to <b>Move</b> mode: on iPhone tap <b>Move</b> in the mode bar at the top of the map (Quiet · Manual · Significant · Move); on Android, the mode icon in the top bar. If you connected with the button, it's already on Move.", "Don't swipe OwnTracks away. It can stay in the background with the screen locked.", "After the race switch to <b>Significant</b> or <b>Quiet</b>, or uninstall it."],
  manual: "Connect button didn't work? Set it up by hand",
  m1: "In OwnTracks: Settings / Preferences → Connection → Mode: <b>HTTP</b>.", m2: "URL or Host (copy it whole):", m3: id => `Tracker ID: <b>${id}</b>. Authentication / username and password: off or empty.`, m4: "Save, then switch monitoring mode to <b>Move</b> (step 6).",
  copy: "Copy", copied: "Copied",
  privacy: "Only your cheer crew (whoever has their plan) can see your location, and it's deleted automatically after 14 days.",
  bad: "This link is incomplete. Ask your cheer crew to send it again.",
  ago: s => s < 60 ? `${s} s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : "over 1 h ago"
};
const q = new URLSearchParams(location.hash.slice(1));
const w = q.get("w") || "", name = (q.get("n") || "").slice(0, 40), tid = (q.get("tid") || "CC").replace(/[^A-Z0-9]/gi, "").slice(0, 2).toUpperCase() || "CC";
let L = (q.get("l") || navigator.language || "es").toLowerCase().startsWith("en") ? EN : ES;
document.documentElement.lang = L === EN ? "en" : "es";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const root = document.getElementById("root");
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent), isAnd = /Android/.test(navigator.userAgent);

const url = `${location.origin}/api/pos?w=${encodeURIComponent(w)}`;
const cfg = { _type: "configuration", mode: 3, url, tid, deviceId: "cheer-" + tid.toLowerCase(), username: "cheer", auth: false, usePassword: false,
  monitoring: 2, locatorDisplacement: 50, locatorInterval: 30, moveModeLocatorInterval: 15, locatorPriority: 3,
  pubExtendedData: true, extendedData: true, ignoreInaccurateLocations: 100, cmd: false, remoteConfiguration: false };
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const otLink = "owntracks:///config?inline=" + encodeURIComponent(b64(JSON.stringify(cfg)));

async function readId(x) { const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(x)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 24); }

function render() {
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(w)) { root.innerHTML = `<div class="err card"><p>${L.bad}</p></div>`; return; }
  const store = [];
  if (!isAnd) store.push(`<a class="btn${isIOS ? " primary" : ""}" href="https://apps.apple.com/app/owntracks/id692424691" target="_blank" rel="noopener">App Store (iPhone)</a>`);
  if (!isIOS) store.push(`<a class="btn${isAnd ? " primary" : ""}" href="https://play.google.com/store/apps/details?id=org.owntracks.android" target="_blank" rel="noopener">Google Play (Android)</a>`);
  root.innerHTML = `<div class="hero"><button class="lang" id="lang">${L === EN ? "ES" : "EN"}</button><div class="race">Cheer Crew · ${L.race}</div><h1>${esc(L.title(name))}</h1><p>${L.intro}</p></div>
  <main>
    <section class="card"><h2><span class="n">1</span>${L.s1}</h2><p class="muted">${L.s1p}</p><div class="row">${store.join("")}</div></section>
    <section class="card"><h2><span class="n">2</span>${L.sx}</h2><p class="muted">${L.sxp}</p><ul>${isAnd ? "" : `<li>${L.sxios}</li>`}${isIOS ? "" : `<li>${L.sxand}</li>`}</ul></section>
    <section class="card"><h2><span class="n">3</span>${L.s2}</h2><a class="btn primary big" href="${otLink}">${L.s2b}</a><p class="muted">${L.s2p}</p>
      <details><summary>${L.manual}</summary><ul style="margin-top:8px"><li>${L.m1}</li><li>${L.m2}<div class="copy"><code id="url">${esc(url)}</code><button id="cp">${L.copy}</button></div></li><li>${L.m3(esc(tid))}</li><li>${L.m4}</li></ul></details></section>
    <section class="card"><h2><span class="n">4</span>${L.s3}</h2><ul>${isAnd ? "" : `<li>${L.s3ios}</li>`}${isIOS ? "" : `<li>${L.s3and}</li>`}</ul></section>
    <section class="card"><h2><span class="n">5</span>${L.s4}</h2><p class="muted">${L.s4p}</p><div class="status wait" id="st" role="status" aria-live="polite"><span class="dot"></span><span>${L.wait}</span></div></section>
    <section class="card"><h2><span class="n">6</span>${L.s5}</h2><ul>${L.s5l.map(x => `<li>${x}</li>`).join("")}</ul></section>
    <p class="muted" style="text-align:center">${L.privacy}</p>
  </main>`;
  document.getElementById("lang").onclick = () => { L = L === EN ? ES : EN; document.documentElement.lang = L === EN ? "en" : "es"; render(); check(); };
  document.getElementById("cp").onclick = async e => { try { await navigator.clipboard.writeText(url); e.target.textContent = L.copied; } catch (x) { getSelection().selectAllChildren(document.getElementById("url")); } };
}
let id = null, last = null;
async function check() {
  const el = document.getElementById("st"); if (!el) return;
  try {
    id = id || await readId(w);
    const r = await fetch(`/api/pos?id=${id}${last ? "&since=" + (last[6] || last[0]) : ""}`, { cache: "no-store" });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) { el.className = "status bad"; el.innerHTML = `<span class="dot"></span><span>${j && j.error === "storage" ? L.noStore : L.net}</span>`; return; }
    const pts = j.r[id] || []; if (pts.length) last = pts[pts.length - 1];
    if (last) { const s = Math.max(1, Math.round((Date.now() - last[0]) / 1000)); el.className = "status ok"; el.innerHTML = `<span class="dot"></span><span>${L.ok(L.ago(s))}${last[5] != null ? " · 🔋" + last[5] + "%" : ""}</span>`; }
  } catch (e) { el.className = "status bad"; el.innerHTML = `<span class="dot"></span><span>${L.net}</span>`; }
}
render(); check(); setInterval(check, 8000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
</script>
</body>
</html>
